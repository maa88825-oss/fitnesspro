<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FITNESS PRO | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #020617; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-slate-200 antialiased">

    <div class="flex min-h-screen">
        <aside class="w-20 md:w-72 bg-slate-900 border-l border-slate-800 flex flex-col items-center py-10 px-4 sticky top-0 h-screen z-50">
            <div class="mb-12 text-emerald-500 font-black text-xl hidden md:block italic tracking-tighter text-center leading-tight">
                FITNESS TIME <span class="text-white block">PRO DASHBOARD</span>
            </div>
            <nav class="flex flex-col gap-3 w-full">
                <button onclick="showTab(1)" class="tab-btn active w-full flex items-center justify-center md:justify-start gap-4 p-4 rounded-2xl transition text-slate-400 hover:bg-slate-800 group" data-tab="1">
                    <span class="text-xl">📊</span> <span class="hidden md:block text-sm font-bold">حاسبة 1RM</span>
                </button>
                <button onclick="showTab(2)" class="tab-btn w-full flex items-center justify-center md:justify-start gap-4 p-4 rounded-2xl transition text-slate-400 hover:bg-slate-800" data-tab="2">
                    <span class="text-xl">📖</span> <span class="hidden md:block text-sm font-bold">قاموس التمارين</span>
                </button>
                <button onclick="showTab(3)" class="tab-btn w-full flex items-center justify-center md:justify-start gap-4 p-4 rounded-2xl transition text-slate-400 hover:bg-slate-800" data-tab="3">
                    <span class="text-xl">🏋️</span> <span class="hidden md:block text-sm font-bold">برنامج التقويات</span>
                </button>
                <button onclick="showTab(4)" class="tab-btn w-full flex items-center justify-center md:justify-start gap-4 p-4 rounded-2xl transition text-slate-400 hover:bg-slate-800" data-tab="4">
                    <span class="text-xl">🏃</span> <span class="hidden md:block text-sm font-bold">تطوير الجري</span>
                </button>
                <button onclick="showTab(5)" class="tab-btn w-full flex items-center justify-center md:justify-start gap-4 p-4 rounded-2xl transition text-slate-400 hover:bg-slate-800" data-tab="5">
                    <span class="text-xl">🚣</span> <span class="hidden md:block text-sm font-bold">التجديف</span>
                </button>
                <button onclick="showTab(6)" class="tab-btn w-full flex items-center justify-center md:justify-start gap-4 p-4 rounded-2xl transition text-slate-400 hover:bg-slate-800" data-tab="6">
                    <span class="text-xl">🎯</span> <span class="hidden md:block text-sm font-bold">الاختبارات</span>
                </button>
            </nav>
        </aside>

        <main class="flex-1 p-6 md:p-12 overflow-y-auto h-screen bg-slate-950">
            
            <div id="tab-1" class="tab-content active">
                <h2 class="text-2xl font-black text-white mb-6 border-b border-slate-800 pb-4">حاسبة الـ 1RM والشدة</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="rm-grid"></div>
            </div>

            <div id="tab-2" class="tab-content">
                <h2 class="text-2xl font-black text-white mb-6">قاموس التمارين</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="exercise-grid"></div>
            </div>

            <div id="tab-3" class="tab-content">
                <h2 class="text-2xl font-black text-white mb-6">برنامج التقويات (Waves)</h2>
                <button onclick="generateWaves()" class="bg-emerald-600 p-4 rounded-xl font-bold mb-8">توليد برنامج الـ 12 أسبوع</button>
                <div id="waves-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            </div>

            <div id="tab-4" class="tab-content text-center py-10">
                <h2 class="text-2xl font-black text-white mb-6">مناطق نبض القلب (Running)</h2>
                <input type="number" id="age-input" placeholder="أدخل عمرك" class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-center text-white mb-6">
                <button onclick="calcZones()" class="bg-blue-600 p-4 rounded-xl block mx-auto">احسب المناطق</button>
                <div id="zones-res" class="mt-8 space-y-4 max-w-md mx-auto"></div>
            </div>

            <div id="tab-5" class="tab-content text-center">
                <h2 class="text-2xl font-black text-white mb-6 uppercase italic">Rowing Concept 2</h2>
                <div class="flex gap-2 justify-center mb-6">
                    <input type="number" id="row-m" placeholder="دقيقة" class="bg-slate-900 p-3 rounded-lg text-white w-24">
                    <input type="number" id="row-s" placeholder="ثانية" class="bg-slate-900 p-3 rounded-lg text-white w-24">
                </div>
                <button onclick="calcRow()" class="bg-orange-600 p-4 rounded-xl">تحليل الـ Split</button>
                <div id="row-res" class="mt-8 text-3xl font-black text-orange-500 italic"></div>
            </div>

            <div id="tab-6" class="tab-content">
                <h2 class="text-2xl font-black text-white mb-6 italic uppercase">Physical Benchmarks</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800">
                        <p class="text-purple-400 font-bold mb-4">Cooper Test (12m)</p>
                        <input type="number" id="cooper-in" placeholder="المسافة بالمتر" class="bg-slate-950 p-3 rounded-lg w-full text-white mb-4">
                        <button onclick="evalTest('cooper')" class="bg-purple-600 w-full p-2 rounded-lg font-bold">تقييم</button>
                        <div id="cooper-res" class="mt-4 font-bold"></div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-slate-800', 'text-emerald-500');
                if(b.dataset.tab == id) b.classList.add('bg-slate-800', 'text-emerald-500');
            });
        }

        // Logic for 1RM
        const exList = ["Back Squat", "Front Squat", "Shoulder Press", "Deadlift", "Clean", "Snatch"];
        function initRM() {
            const grid = document.getElementById('rm-grid');
            exList.forEach((ex, i) => {
                grid.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl">
                        <h4 class="text-emerald-500 font-bold mb-4 uppercase text-xs">${ex}</h4>
                        <div class="flex gap-2 mb-4 text-slate-950">
                            <input type="number" id="w-${i}" oninput="update(${i})" placeholder="وزن" class="w-1/2 p-2 rounded-lg bg-slate-950 text-white border border-slate-800 outline-none">
                            <input type="number" id="r-${i}" oninput="update(${i})" placeholder="عدات" class="w-1/2 p-2 rounded-lg bg-slate-950 text-white border border-slate-800 outline-none">
                        </div>
                        <div class="text-center bg-slate-950 p-3 rounded-xl border border-slate-800">
                            <span id="res-${i}" class="text-3xl font-black text-white">0</span> <span class="text-[10px] text-slate-500">KG</span>
                        </div>
                    </div>`;
            });
        }
        function update(i) {
            const w = document.getElementById(`w-${i}`).value || 0;
            const r = document.getElementById(`r-${i}`).value || 0;
            const rm = r == 1 ? w : w * (1 + r/30);
            document.getElementById(`res-${i}`).innerText = Math.round(rm);
        }

        // Running Zones
        function calcZones() {
            const age = document.getElementById('age-input').value || 38;
            const max = 220 - age;
            const res = document.getElementById('zones-res');
            res.innerHTML = `
                <div class="p-4 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-emerald-400 font-bold">Zone 2 (Aerobic): ${Math.round(max*0.6)}-${Math.round(max*0.7)} BPM</div>
                <div class="p-4 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 font-bold">Zone 4 (Threshold): ${Math.round(max*0.8)}-${Math.round(max*0.9)} BPM</div>
            `;
        }

        // Rowing
        function calcRow() {
            const m = document.getElementById('row-m').value || 0;
            const s = document.getElementById('row-s').value || 0;
            const split = ((parseInt(m)*60) + parseInt(s)) / 4;
            document.getElementById('row-res').innerText = `Pace: ${Math.floor(split/60)}:${Math.round(split%60).toString().padStart(2,'0')} /500m`;
        }

        // Tests
        function evalTest(type) {
            const v = document.getElementById('cooper-in').value;
            let l = v > 2800 ? "ممتاز" : (v > 2200 ? "جيد" : "ضعيف");
            document.getElementById('cooper-res').innerText = `التقييم: ${l}`;
        }

        window.onload = () => { initRM(); showTab(1); };
    </script>
</body>
</html>
