<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit Pro Dashboard v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        .active-tab { 
            background: linear-gradient(to left, rgba(16, 185, 129, 0.1), transparent);
            border-right: 4px solid #10b981;
            color: #10b981;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex overflow-hidden">

    <aside class="w-64 bg-slate-900 border-l border-slate-800 flex flex-col z-50">
        <div class="p-6 border-b border-slate-800 flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-emerald-500 to-cyan-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                <i class="fas fa-bolt text-xl"></i>
            </div>
            <h1 class="text-xl font-bold tracking-wider text-white uppercase italic">Fit Pro</h1>
        </div>

        <nav class="flex-1 mt-6 px-3 space-y-2 overflow-y-auto custom-scrollbar">
            <button onclick="switchTab('rm-tab')" id="btn-rm-tab" class="nav-link active-tab w-full flex items-center gap-4 px-4 py-3 rounded-lg transition-all text-slate-400">
                <i class="fas fa-dumbbell w-6 text-emerald-500"></i>
                <span class="font-medium">حاسبة 1RM</span>
            </button>
            <button onclick="switchTab('dictionary-tab')" id="btn-dictionary-tab" class="nav-link w-full flex items-center gap-4 px-4 py-3 rounded-lg transition-all text-slate-400">
                <i class="fas fa-book-open w-6 text-amber-500"></i>
                <span class="font-medium">قاموس التمارين</span>
            </button>
            <button onclick="switchTab('gym-tab')" id="btn-gym-tab" class="nav-link w-full flex items-center gap-4 px-4 py-3 rounded-lg transition-all text-slate-400">
                <i class="fas fa-layer-group w-6 text-cyan-500"></i>
                <span class="font-medium">برنامج التقويات</span>
            </button>
            <button onclick="switchTab('run-tab')" id="btn-run-tab" class="nav-link w-full flex items-center gap-4 px-4 py-3 rounded-lg transition-all text-slate-400">
                <i class="fas fa-running w-6 text-rose-500"></i>
                <span class="font-medium">برنامج الجري</span>
            </button>
            <button onclick="switchTab('row-tab')" id="btn-row-tab" class="nav-link w-full flex items-center gap-4 px-4 py-3 rounded-lg transition-all text-slate-400">
                <i class="fas fa-water w-6 text-blue-500"></i>
                <span class="font-medium">برنامج التجديف</span>
            </button>
            <button onclick="switchTab('test-tab')" id="btn-test-tab" class="nav-link w-full flex items-center gap-4 px-4 py-3 rounded-lg transition-all text-slate-400">
                <i class="fas fa-vial w-6 text-purple-500"></i>
                <span class="font-medium">الاختبارات البدنية</span>
            </button>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar">
        
        <section id="rm-tab" class="tab-content block">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold text-white border-r-4 border-emerald-500 pr-4 italic uppercase">1RM Calculator</h2>
                <div class="bg-slate-900 p-1 rounded-xl border border-slate-800 flex">
                    <button onclick="setUnit('kg')" id="unit-kg" class="px-6 py-2 rounded-lg bg-emerald-600 text-white font-bold">KG</button>
                    <button onclick="setUnit('lb')" id="unit-lb" class="px-6 py-2 rounded-lg text-slate-400 font-bold">LB</button>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="rm-cards"></div>
        </section>

        <section id="dictionary-tab" class="tab-content hidden">
            <h2 class="text-3xl font-bold text-white border-r-4 border-amber-500 pr-4 mb-8 italic uppercase">Exercise Dictionary</h2>
            <div id="dictionary-content" class="space-y-8"></div>
        </section>

        <section id="gym-tab" class="tab-content hidden">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold text-white border-r-4 border-cyan-500 pr-4 italic uppercase">Wave Program (12 Weeks)</h2>
                <select id="gym-days" onchange="renderGymProgram()" class="bg-slate-900 border border-slate-700 text-white px-4 py-2 rounded-lg outline-none">
                    <option value="1">1 يوم / أسبوع</option>
                    <option value="2">2 يوم / أسبوع</option>
                    <option value="3" selected>3 أيام / أسبوع</option>
                </select>
            </div>
            <div id="gym-program-content" class="space-y-6"></div>
        </section>

        <section id="run-tab" class="tab-content hidden">
            <h2 class="text-3xl font-bold text-white border-r-4 border-rose-500 pr-4 mb-8 italic uppercase">30-Min Run Builder</h2>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 mb-8">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-slate-400 mb-2">أفضل مسافة في 30 دقيقة (متر):</label>
                        <input type="number" id="run-dist" oninput="saveRunData()" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white outline-none focus:border-rose-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-2">أقصى نبض قلب (Max HR):</label>
                        <input type="number" id="max-hr" oninput="saveRunData()" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white outline-none focus:border-rose-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-2">نبض الراحة (Rest HR):</label>
                        <input type="number" id="rest-hr" oninput="saveRunData()" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white outline-none focus:border-rose-500">
                    </div>
                </div>
            </div>
            <div id="run-program-table"></div>
        </section>

        <section id="row-tab" class="tab-content hidden">
            <h2 class="text-3xl font-bold text-white border-r-4 border-blue-500 pr-4 mb-8 italic uppercase">Concept 2 (2000m Plan)</h2>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 mb-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 italic">
                    <div>
                        <label class="block text-slate-400 mb-2 font-bold uppercase">2000m Test Time (MM:SS):</label>
                        <input type="text" id="row-time" placeholder="07:30" oninput="saveRowData()" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-2 font-bold uppercase">Damper Setting:</label>
                        <input type="number" value="5" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white">
                    </div>
                </div>
            </div>
            <div id="row-program-content"></div>
        </section>

        <section id="test-tab" class="tab-content hidden">
            <h2 class="text-3xl font-bold text-white border-r-4 border-purple-500 pr-4 mb-8 italic uppercase">Fitness Testing Battery</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                    <h3 class="text-xl font-bold mb-4 text-purple-400 italic uppercase">User Profile</h3>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center bg-slate-950 p-3 rounded-lg">
                            <span>الوزن (كجم):</span>
                            <input type="number" id="test-weight" oninput="updateProfile()" class="w-24 bg-transparent text-left outline-none border-b border-purple-500">
                        </div>
                        <div class="flex justify-between items-center bg-slate-950 p-3 rounded-lg">
                            <span>الطول (سم):</span>
                            <input type="number" id="test-height" oninput="updateProfile()" class="w-24 bg-transparent text-left outline-none border-b border-purple-500">
                        </div>
                        <div class="p-3 bg-purple-500/10 rounded-lg text-sm">
                            <p>BMI: <span id="bmi-val" class="font-bold">--</span></p>
                            <p>الحالة: <span id="bmi-status" class="font-bold">--</span></p>
                        </div>
                    </div>
                </div>
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                    <h3 class="text-xl font-bold mb-4 text-purple-400 italic uppercase">Functional Tests</h3>
                    <div class="space-y-3">
                        <div class="bg-slate-950 p-3 rounded-lg flex justify-between">
                            <span>اختبار الضغط (1 دقيقة):</span>
                            <input type="number" id="test-pushup" oninput="saveTests()" class="w-16 bg-transparent text-center border-b border-purple-500 outline-none">
                        </div>
                        <div class="bg-slate-950 p-3 rounded-lg flex justify-between">
                            <span>Plank (ثانية):</span>
                            <input type="number" id="test-plank" oninput="saveTests()" class="w-16 bg-transparent text-center border-b border-purple-500 outline-none">
                        </div>
                        <div class="bg-slate-950 p-3 rounded-lg flex justify-between">
                            <span>Cooper Test (مسافة):</span>
                            <input type="number" id="test-cooper" oninput="saveTests()" class="w-16 bg-transparent text-center border-b border-purple-500 outline-none">
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script>
        // --- 1. Core Logic & Variables ---
        let currentUnit = 'kg';
        const roundToEven = (num) => Math.round(num / 2) * 2;
        
        // --- 2. Tab Navigation ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active-tab'));
            document.getElementById(`btn-${tabId}`).classList.add('active-tab');
            
            if(tabId === 'rm-tab') renderRM();
            if(tabId === 'dictionary-tab') renderDictionary();
            if(tabId === 'gym-tab') renderGymProgram();
            if(tabId === 'run-tab') renderRunProgram();
            if(tabId === 'row-tab') renderRowProgram();
        }

        // --- 3. 1RM Calculator Logic ---
        const ex1RM = ["Squat", "Front Squat", "Shoulder Press", "Deadlift", "Snatch", "Clean", "Jerk"];
        function setUnit(u) { currentUnit = u; renderRM(); }

        function renderRM() {
            const container = document.getElementById('rm-cards');
            container.innerHTML = '';
            ex1RM.forEach(ex => {
                const data = JSON.parse(localStorage.getItem(`rm_${ex}`)) || { w: '', r: '' };
                const val1RM = data.w * (1 + data.r / 30);
                container.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                        <h3 class="text-xl font-bold text-white mb-4 uppercase italic">${ex}</h3>
                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <input type="number" placeholder="Weight" oninput="saveRM('${ex}', this.value, 'w')" value="${data.w}" class="bg-slate-950 border border-slate-800 p-2 rounded text-center text-white outline-none focus:border-emerald-500">
                            <input type="number" placeholder="Reps" oninput="saveRM('${ex}', this.value, 'r')" value="${data.r}" class="bg-slate-950 border border-slate-800 p-2 rounded text-center text-white outline-none focus:border-emerald-500">
                        </div>
                        <div class="h-40 overflow-y-auto custom-scrollbar border border-slate-800 rounded">
                            <table class="w-full text-xs text-center">
                                <thead class="bg-slate-800 sticky top-0"><tr><th class="p-1">%</th><th class="p-1">KG</th><th class="p-1">LB</th></tr></thead>
                                <tbody>${Array.from({length:13}, (_,i)=>100 - i*5).map(p => `
                                    <tr class="border-b border-slate-800">
                                        <td>${p}%</td>
                                        <td>${roundToEven(val1RM * (p/100))}</td>
                                        <td>${roundToEven(val1RM * (p/100) * 2.2)}</td>
                                    </tr>`).join('')}</tbody>
                            </table>
                        </div>
                    </div>`;
            });
        }
        function saveRM(ex, v, t) {
            let d = JSON.parse(localStorage.getItem(`rm_${ex}`)) || { w:0, r:0 };
            d[t] = parseFloat(v) || 0;
            localStorage.setItem(`rm_${ex}`, JSON.stringify(d));
            renderRM();
        }

        // --- 4. Dictionary & Selection ---
        const dict = {
            "Chest": ["Flat Bench Press", "Incline Bench Press", "Dumbbell Flyes", "Cable Cross"],
            "Back": ["Deadlift", "Lat Pulldown", "Barbell Row", "Seated Row"],
            "Legs": ["Back Squat", "Romanian Deadlift", "Leg Press", "Calf Raise"],
            "Shoulders": ["Overhead Press", "Lateral Raise", "Rear Delt Fly"],
            "Arms": ["Bicep Curl", "Tricep Pushdown", "Skull Crushers"]
        };

        function renderDictionary() {
            const container = document.getElementById('dictionary-content');
            const selected = JSON.parse(localStorage.getItem('selected_ex')) || [];
            container.innerHTML = Object.entries(dict).map(([cat, exs]) => `
                <div>
                    <h3 class="text-xl font-bold mb-4 text-white">${cat}</h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        ${exs.map(e => `
                            <div onclick="toggleEx('${e}')" class="p-4 rounded-xl border cursor-pointer transition-all ${selected.includes(e) ? 'border-amber-500 bg-amber-500/10 text-amber-500' : 'border-slate-800 bg-slate-900 text-slate-400'}">
                                ${e}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }
        function toggleEx(e) {
            let s = JSON.parse(localStorage.getItem('selected_ex')) || [];
            if(s.includes(e)) s = s.filter(i => i !== e); else s.push(e);
            localStorage.setItem('selected_ex', JSON.stringify(s));
            renderDictionary();
        }

        // --- 5. Gym Program (Wave System) ---
        function renderGymProgram() {
            const selected = JSON.parse(localStorage.getItem('selected_ex')) || [];
            const container = document.getElementById('gym-program-content');
            if(!selected.length) { container.innerHTML = "<p class='text-center text-slate-500'>اختر تمارين من القاموس أولاً</p>"; return; }

            container.innerHTML = selected.map(ex => {
                const tenRM = localStorage.getItem(`10rm_${ex}`) || 0;
                const oneRM = tenRM / 0.75;
                return `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-xl font-bold text-cyan-400 uppercase">${ex}</h3>
                            <input type="number" placeholder="10RM Weight" oninput="save10RM('${ex}', this.value)" value="${tenRM}" class="bg-slate-950 border border-slate-700 p-2 rounded text-center w-32">
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-center text-sm">
                                <thead class="bg-slate-800 text-slate-400">
                                    <tr><th class="p-2">الاسبوع</th><th class="p-2">الوزن</th><th class="p-2">الشدة</th><th class="p-2">التكرارات</th><th class="p-2">الراحة</th></tr>
                                </thead>
                                <tbody>
                                    ${[
                                        {p:0.72, r:"3x12-15", rest:"90s", n:"أساس"},
                                        {p:0.82, r:"4x8-10", rest:"2m", n:"تطوير"},
                                        {p:0.92, r:"4x5-6", rest:"3-5m", n:"ذروة"},
                                        {p:0.55, r:"2x12", rest:"60s", n:"ديلود", dl:true}
                                    ].map((s, i) => `
                                        <tr class="border-b border-slate-800 ${s.dl ? 'bg-slate-950 text-slate-500' : ''}">
                                            <td class="p-3">${i+1} (${s.n})</td>
                                            <td class="p-3 font-bold text-white">${roundToEven(oneRM * s.p)}</td>
                                            <td class="p-3">${(s.p*100).toFixed(0)}%</td>
                                            <td class="p-3">${s.r}</td>
                                            <td class="p-3 italic">${s.rest}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }).join('');
        }
        function save10RM(ex, v) { localStorage.setItem(`10rm_${ex}`, v); renderGymProgram(); }

        // --- 6. Run & Row Logic ---
        function saveRunData() {
            localStorage.setItem('run_dist', document.getElementById('run-dist').value);
            localStorage.setItem('max_hr', document.getElementById('max-hr').value);
            localStorage.setItem('rest_hr', document.getElementById('rest-hr').value);
            renderRunProgram();
        }
        function renderRunProgram() {
            const dist = localStorage.getItem('run_dist');
            if(!dist) return;
            document.getElementById('run-program-table').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 italic">
                    <div class="bg-slate-900 p-6 rounded-2xl border border-rose-500/20">
                        <h4 class="text-rose-500 font-bold mb-2">السرعة المستهدفة (Average Pace):</h4>
                        <p class="text-3xl font-bold">${(30 / (dist/1000)).toFixed(2)} min/km</p>
                    </div>
                </div>
            `;
        }

        function saveRowData() {
            localStorage.setItem('row_time', document.getElementById('row-time').value);
            renderRowProgram();
        }
        function renderRowProgram() {
            const time = localStorage.getItem('row_time');
            if(!time) return;
            document.getElementById('row-program-content').innerHTML = `
                <div class="bg-slate-900 p-6 rounded-2xl border border-blue-500/20">
                    <p class="text-blue-400">برنامج الـ 12 أسبوع (Concept 2) جاهز بناءً على زمن: ${time}</p>
                    <ul class="mt-4 space-y-2 text-sm text-slate-400">
                        <li>• المرحلة 1: بناء القاعدة (SPM 18-20)</li>
                        <li>• المرحلة 2: عتبة اللاكتيك (SPM 24-26)</li>
                        <li>• المرحلة 3: السرعة القصوى (SPM 30+)</li>
                    </ul>
                </div>`;
        }

        // --- 7. Profile & BMI ---
        function updateProfile() {
            const w = document.getElementById('test-weight').value;
            const h = document.getElementById('test-height').value / 100;
            if(w && h) {
                const bmi = (w / (h*h)).toFixed(1);
                document.getElementById('bmi-val').innerText = bmi;
                document.getElementById('bmi-status').innerText = bmi < 25 ? 'مثالي' : 'زيادة وزن';
            }
        }

        // --- Initialization ---
        window.onload = () => {
            // Load saved data
            document.getElementById('run-dist').value = localStorage.getItem('run_dist');
            document.getElementById('max-hr').value = localStorage.getItem('max_hr');
            document.getElementById('rest-hr').value = localStorage.getItem('rest_hr');
            document.getElementById('row-time').value = localStorage.getItem('row_time');
            
            renderRM();
            switchTab('rm-tab');
        };
    </script>
</body>
</html>
